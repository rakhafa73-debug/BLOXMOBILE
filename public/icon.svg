<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f28" />
      <stop offset="100%" stop-color="#0a0812" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="4" fill="none" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="170" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 12" />

  <!-- Hexagonal Shield / Diamond Emblem (Bloxstrap style) -->
  <g filter="url(#glow)">
    <polygon points="256,76 416,168 416,344 256,436 96,344 96,168"
             fill="#191523" stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round" />
  </g>

  <!-- Inner Cube isometric lines representing Roblox/Blox building block & companion -->
  <!-- Top Face -->
  <polygon points="256,150 340,198 256,246 172,198" fill="url(#primaryGrad)" fill-opacity="0.9" />
  <!-- Left Face -->
  <polygon points="172,198 256,246 256,346 172,298" fill="#6d28d9" fill-opacity="0.85" />
  <!-- Right Face -->
  <polygon points="256,246 340,198 340,298 256,346" fill="#4c1d95" fill-opacity="0.85" />

  <!-- Inner mobile phone / lightning symbol accent -->
  <path d="M256 180 L268 230 L288 230 L248 300 L256 250 L236 250 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Corner nodes -->
  <circle cx="256" cy="76" r="8" fill="#c4b5fd" />
  <circle cx="416" cy="168" r="8" fill="#c4b5fd" />
  <circle cx="416" cy="344" r="8" fill="#c4b5fd" />
  <circle cx="256" cy="436" r="8" fill="#c4b5fd" />
  <circle cx="96" cy="344" r="8" fill="#c4b5fd" />
  <circle cx="96" cy="168" r="8" fill="#c4b5fd" />
</svg>
